name: build-bdmenu-m1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-nasm make

      - name: Install NASM and expose MinGW cross tools on PATH
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          $roots = @('C:\Program Files\NASM','C:\msys64','D:\a\_temp\setup-msys2','C:\mingw64')
          $tools = @('nasm.exe','x86_64-w64-mingw32-ar.exe','x86_64-w64-mingw32-gcc.exe','x86_64-w64-mingw32-ranlib.exe')
          $dirs = @($env:GITHUB_WORKSPACE)
          foreach ($tool in $tools) {
            $found = $null
            foreach ($r in $roots) {
              if (Test-Path $r) {
                $found = Get-ChildItem -Path $r -Filter $tool -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($null -ne $found) { break }
              }
            }
            if ($null -eq $found -and $tool -in @('x86_64-w64-mingw32-ar.exe','x86_64-w64-mingw32-ranlib.exe')) {
              $llvmName = if ($tool -like '*ar.exe') { 'llvm-ar.exe' } else { 'llvm-ranlib.exe' }
              $llvm = "C:\Program Files\LLVM\bin\$llvmName"
              if (Test-Path $llvm) {
                Write-Host "$tool fallback -> $llvm"
                Copy-Item $llvm (Join-Path $env:GITHUB_WORKSPACE $tool) -Force
                continue
              }
            }
            if ($null -eq $found) { Write-Host "WARN: $tool not found"; continue }
            Write-Host "$tool -> $($found.FullName)"
            Copy-Item $found.FullName (Join-Path $env:GITHUB_WORKSPACE $tool) -Force
            $dirs += $found.DirectoryName
          }
          $dirs | Where-Object { $_ } | Sort-Object -Unique | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Install libbluray (static, via vcpkg)
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install libbluray:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $libdir = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows-static\lib'
          Write-Host "vcpkg lib dir: $libdir"
          Get-ChildItem -Path $libdir -Filter '*.lib' | Copy-Item -Destination $env:GITHUB_WORKSPACE -Force
          Get-ChildItem -Path $libdir -Filter '*.lib' | Copy-Item -Destination (Join-Path $env:GITHUB_WORKSPACE 'lib64') -Force

      - name: Setup MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build MPC-BE 1.9.3 + M1 reader
        shell: cmd
        run: |
          echo @ECHO OFF > environments.bat
          echo SET "MPCBE_MSYS=C:\mingw64" >> environments.bat
          echo SET "MPCBE_MINGW=C:\mingw64" >> environments.bat
          set PATH=%CD%;C:\mingw64\bin;D:\a\_temp\setup-msys2\mingw64\bin;D:\a\_temp\setup-msys2\usr\bin;%PATH%
          where gcc
          where nasm
          call update_gcc.bat
          if not exist lib64\libmingwex.a for /r C:\mingw64 %%f in (libmingwex.a) do copy /Y "%%~f" "lib64\"
          if not exist lib64\libgcc.a for /r C:\mingw64 %%f in (libgcc.a) do copy /Y "%%~f" "lib64\"
          if not exist lib64\libbluray.lib (echo ERROR: libbluray.lib missing in lib64 & exit /b 1)
          dir lib64\libbluray.lib
          msbuild mpc-be.sln /t:Build /p:Configuration=Release /p:Platform=x64 /p:AdditionalLibraryDirectories="%CD%\lib64;%CD%\_bin\lib\Release_x64" /m /v:minimal /nologo

      - name: Package portable zip
        shell: pwsh
        run: |
          $vcpkgLib = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows-static\lib\libbluray.lib'
          if (Test-Path $vcpkgLib) { Copy-Item $vcpkgLib "_bin\lib\Release_x64\" -Force }
          Compress-Archive -Path "_bin\*" -DestinationPath "MPC-BE-BDMenu-M1-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPC-BE-BDMenu-M1-x64
          path: MPC-BE-BDMenu-M1-x64.zip
