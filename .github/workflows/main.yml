name: BDMenu Build

# MPC-BE 1.9.3 + BDMenu (bdnav.dll / libbluray). Branch bdmenu-qw only (or manual).
on:
  workflow_dispatch:
  push:
    branches: [ bdmenu-qw ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bdmenu/tools/**'
      - '.github/workflows/bdprobe.yml'
      - '.github/workflows/bdlibs.yml'

concurrency:
  group: bdmenu-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bin
          key: vcpkg-libbluray-x64-static-v1

      - name: Install libbluray (static) via vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:RUNNER_TEMP\vcpkg-bin"
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libbluray:x64-windows-static
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build bdnav.dll
        shell: pwsh
        run: |
          $v = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"
          $libs = (Get-ChildItem "$v\lib" -Filter '*.lib' | ForEach-Object { '"' + $_.FullName + '"' }) -join ' '
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          New-Item -ItemType Directory -Force _bdnav | Out-Null
          $cmd = @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -arch=amd64 -no_logo
          cd /d "$env:GITHUB_WORKSPACE"
          cl /nologo /O2 /W3 /MT /utf-8 /DBDNAV_BUILD /I "$v\include" /I src\apps\mplayerc\BDNav bdmenu\bdnav\bdnav.c /LD /Fe_bdnav\bdnav.dll /Fo_bdnav\ /link $libs gdi32.lib user32.lib shell32.lib advapi32.lib bcrypt.lib ole32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          dumpbin /nologo /dependents _bdnav\bdnav.dll
          dumpbin /nologo /exports _bdnav\bdnav.dll
          "@
          Set-Content -Path _bdnav\build.cmd -Value $cmd -Encoding ascii
          cmd /c _bdnav\build.cmd
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item _bdnav\bdnav.dll | Select-Object Name, Length

      - name: Upload bdnav.dll
        uses: actions/upload-artifact@v7
        with:
          name: bdnav-dll
          path: _bdnav/bdnav.dll

      - name: Prepare MSYS
        run: |
          curl -sSL https://github.com/Aleksoid1978/MSYS/raw/main/MSYS_MinGW-w64_GCC_1521_x86-x64.7z -o MSYS.7z
          7z x MSYS.7z -oC:\\MSYS
          echo '@ECHO OFF' > environments.bat
          echo 'SET "MPCBE_MSYS=C:\\MSYS"' >> environments.bat
          echo 'SET "MPCBE_MINGW=C:\\MSYS\\mingw"' >> environments.bat
          .\\update_gcc.bat
        shell: pwsh

      - name: Build MPC-BE x64 portable
        run: |
          .\\build.bat Build x64 Zip NoWait
        shell: pwsh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: _bin/logs/**
          if-no-files-found: ignore

      - name: Assemble portable package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem _bin/Packages -Recurse -Filter 'MPC-BE*.x64.7z' | Select-Object -First 1
          if (-not $pkg) { throw 'portable 7z not found' }
          7z x $pkg.FullName -o_dist -y | Out-Null
          $exe = Get-ChildItem _dist -Recurse -Filter 'mpc-be64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'mpc-be64.exe not found' }
          Copy-Item _bdnav\bdnav.dll $exe.DirectoryName
          if (Test-Path bdmenu\packaging) { Copy-Item bdmenu\packaging\* $exe.DirectoryName }
          Get-ChildItem $exe.DirectoryName | Select-Object Name, Length

      - name: Upload portable x64 (zip)
        uses: actions/upload-artifact@v7
        with:
          name: MPC-BE-BDMenu-x64
          path: _dist/**
