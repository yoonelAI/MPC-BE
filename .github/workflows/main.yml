name: BDMenu Build

# P0: build vanilla MPC-BE 1.9.3 x64 portable exactly like upstream CI.
# Only runs on branch bdmenu-qw (or manually).
on:
  workflow_dispatch:
  push:
    branches: [ bdmenu-qw ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bdmenu/tools/**'
      - '.github/workflows/bdprobe.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare MSYS
        run: |
          curl -sSL https://github.com/Aleksoid1978/MSYS/raw/main/MSYS_MinGW-w64_GCC_1521_x86-x64.7z -o MSYS.7z
          7z x MSYS.7z -oC:\\MSYS
          echo '@ECHO OFF' > environments.bat
          echo 'SET "MPCBE_MSYS=C:\\MSYS"' >> environments.bat
          echo 'SET "MPCBE_MINGW=C:\\MSYS\\mingw"' >> environments.bat
          .\\update_gcc.bat
        shell: pwsh

      - name: Build MPC-BE x64 portable
        run: |
          .\\build.bat Build x64 Zip NoWait
        shell: pwsh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: _bin/logs/**
          if-no-files-found: ignore

      - name: Unpack portable to plain folder
        shell: pwsh
        run: |
          $pkg = Get-ChildItem _bin/Packages -Recurse -Filter 'MPC-BE*.x64.7z' | Select-Object -First 1
          if (-not $pkg) { throw 'portable 7z not found' }
          7z x $pkg.FullName -o_dist -y | Out-Null
          Get-ChildItem _dist -Recurse | Select-Object -First 40 FullName

      - name: Upload portable x64 (zip)
        uses: actions/upload-artifact@v7
        with:
          name: MPC-BE-BDMenu-x64
          path: _dist/**
