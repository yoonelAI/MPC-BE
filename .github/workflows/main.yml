name: BDMenu Build

# P0: build vanilla MPC-BE 1.9.3 x64 portable exactly like upstream CI.
# Only runs on branch bdmenu-qw (or manually).
on:
  workflow_dispatch:
  push:
    branches: [ bdmenu-qw ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare MSYS
        run: |
          curl -sSL https://github.com/Aleksoid1978/MSYS/raw/main/MSYS_MinGW-w64_GCC_1521_x86-x64.7z -o MSYS.7z
          7z x MSYS.7z -oC:\\MSYS
          echo '@ECHO OFF' > environments.bat
          echo 'SET "MPCBE_MSYS=C:\\MSYS"' >> environments.bat
          echo 'SET "MPCBE_MINGW=C:\\MSYS\\mingw"' >> environments.bat
          .\\update_gcc.bat
        shell: pwsh

      - name: Build MPC-BE x64 portable
        run: |
          .\\build.bat Build x64 Zip NoWait
        shell: pwsh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: _bin/logs/**
          if-no-files-found: ignore

      - name: Upload portable x64
        uses: actions/upload-artifact@v7
        with:
          name: MPC-BE-BDMenu-P0-x64
          path: _bin/Packages/**/MPC-BE*.x64.7z
          compression-level: 0
